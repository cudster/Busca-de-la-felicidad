name: Publicar en Instagram (desde Google Sheet)

# Corre en los dos horarios de publicación y también se puede lanzar a mano
# desde la pestaña Actions.
# La corrida de la mañana es 12:00 UTC = 09:00 de Chile (UTC-3), a pedido del
# dueño. Ojo: el cron de GitHub Actions suele atrasarse 5-15 min, nunca adelantarse.
# El estado (published) se escribe de vuelta en la Google Sheet, no en el repo.
on:
  schedule:
    - cron: "0 12 * * *"
    - cron: "10 22 * * *"
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependencias
        run: pip install gspread google-auth

      - name: Publicar posts aprobados y vencidos (lee la Google Sheet)
        env:
          GOOGLE_CREDENTIALS: ${{ secrets.GOOGLE_CREDENTIALS }}
          SHEET_ID: ${{ secrets.SHEET_ID }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          META_PAGE_TOKEN: ${{ secrets.META_PAGE_TOKEN }}
        run: python publish.py --sheet
