name: Publicar en Instagram (desde Google Sheet)

# Corre en los dos horarios de publicación (13:00 y 22:00 UTC) con un buffer,
# y también se puede lanzar a mano desde la pestaña Actions.
# El estado (published) se escribe de vuelta en la Google Sheet, no en el repo.
on:
  schedule:
    - cron: "10 13 * * *"
    - cron: "10 22 * * *"
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependencias
        run: pip install gspread google-auth

      - name: Publicar posts aprobados y vencidos (lee la Google Sheet)
        env:
          GOOGLE_CREDENTIALS: ${{ secrets.GOOGLE_CREDENTIALS }}
          SHEET_ID: ${{ secrets.SHEET_ID }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          META_PAGE_TOKEN: ${{ secrets.META_PAGE_TOKEN }}
        run: python publish.py --sheet
